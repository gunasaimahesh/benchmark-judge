<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark Judge dashboard preview</title>
  <desc id="desc">A preview of the Benchmark Judge dashboard showing model comparison cards, per-label metrics, and a disagreement explorer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#eaf2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a476b" flood-opacity=".10"/>
    </filter>
    <style>
      .title { font: 800 42px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #13223a; letter-spacing: -1.5px; }
      .subtitle { font: 400 18px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #58708f; }
      .eyebrow { font: 800 12px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #53729a; letter-spacing: 2px; }
      .section { font: 800 23px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #13223a; }
      .small { font: 600 13px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #7186a0; }
      .body { font: 600 15px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #38536e; }
      .number { font: 800 30px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1d3657; }
      .tablehead { font: 800 11px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #7890aa; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <rect x="70" y="48" width="1300" height="884" rx="28" fill="#ffffff" opacity=".92" filter="url(#shadow)"/>

  <text x="112" y="104" class="eyebrow">RESEARCH · DATA · SCIENTIFIC COMPUTING</text>
  <text x="112" y="158" class="title">Benchmark Judge</text>
  <text x="112" y="188" class="subtitle">Compare classification models with evidence.</text>
  <rect x="1108" y="101" width="142" height="42" rx="10" fill="#fff" stroke="#d8e2ef"/>
  <text x="1179" y="127" text-anchor="middle" class="body" fill="#2b527f">Load CSV</text>
  <rect x="1260" y="101" width="88" height="42" rx="10" fill="#286bc1"/>
  <text x="1304" y="127" text-anchor="middle" class="body" fill="#fff">Report</text>

  <rect x="110" y="225" width="1220" height="76" rx="14" fill="#fff" stroke="#dce5f0"/>
  <text x="132" y="253" class="small" fill="#277452">✓  VALIDATED</text>
  <text x="132" y="278" class="body">email-triage-sample.csv</text>
  <line x1="391" y1="242" x2="391" y2="284" stroke="#e7edf5"/>
  <text x="421" y="253" class="number">200</text><text x="421" y="278" class="small">rows analyzed</text>
  <line x1="581" y1="242" x2="581" y2="284" stroke="#e7edf5"/>
  <text x="611" y="253" class="number">4</text><text x="611" y="278" class="small">labels</text>
  <line x1="741" y1="242" x2="741" y2="284" stroke="#e7edf5"/>
  <text x="771" y="253" class="number">2</text><text x="771" y="278" class="small">categories</text>
  <line x1="901" y1="242" x2="901" y2="284" stroke="#e7edf5"/>
  <text x="931" y="253" class="number">46</text><text x="931" y="278" class="small">disagreements</text>

  <text x="110" y="355" class="eyebrow">DECISION SUMMARY</text>
  <text x="110" y="389" class="section">Which model is better for this dataset?</text>
  <rect x="1087" y="348" width="243" height="40" rx="10" fill="#f5f8fc" stroke="#dce6f1"/>
  <rect x="1091" y="352" width="81" height="32" rx="7" fill="#fff"/>
  <text x="1132" y="373" text-anchor="middle" class="small" fill="#244d7c">Macro-F1</text>
  <text x="1244" y="373" text-anchor="middle" class="small">Accuracy</text>

  <rect x="110" y="418" width="1220" height="88" rx="14" fill="#eff6ff" stroke="#ccdef4"/>
  <text x="134" y="445" class="eyebrow" fill="#6387ae">WINNER BY MACRO-F1</text>
  <text x="134" y="477" class="section" fill="#174f92">Model B</text>
  <text x="134" y="496" class="small" fill="#6080a4">Model B leads by 12.5 points.</text>
  <text x="1160" y="452" text-anchor="end" class="small">MODEL A</text><text x="1160" y="483" text-anchor="end" class="number">68.2%</text>
  <text x="1295" y="452" text-anchor="end" class="small">MODEL B</text><text x="1295" y="483" text-anchor="end" class="number">80.6%</text>

  <rect x="110" y="525" width="598" height="74" rx="13" fill="#fff" stroke="#dce5f0"/>
  <circle cx="138" cy="553" r="6" fill="#286bc1"/><text x="153" y="558" class="body">Model A</text>
  <text x="138" y="585" class="number">68.2%</text><text x="260" y="585" class="small">macro-F1 · 173 / 200 correct</text>
  <rect x="732" y="525" width="598" height="74" rx="13" fill="#fff" stroke="#dce5f0"/>
  <circle cx="760" cy="553" r="6" fill="#dd812b"/><text x="775" y="558" class="body">Model B</text>
  <text x="760" y="585" class="number">80.6%</text><text x="882" y="585" class="small">macro-F1 · 168 / 200 correct</text>

  <text x="110" y="642" class="eyebrow">WHERE THE DIFFERENCE COMES FROM</text>
  <text x="110" y="676" class="section">Per-label performance</text>
  <rect x="110" y="697" width="1220" height="180" rx="12" fill="#fff" stroke="#e3eaf3"/>
  <rect x="110" y="697" width="1220" height="39" rx="12" fill="#f8fafd"/>
  <text x="132" y="721" class="tablehead">LABEL</text><text x="292" y="721" class="tablehead">SUPPORT</text><text x="420" y="721" class="tablehead">MODEL A · F1</text><text x="640" y="721" class="tablehead">MODEL B · F1</text><text x="858" y="721" class="tablehead">GAP (B − A)</text><text x="1045" y="721" class="tablehead">BETTER</text><text x="1192" y="721" class="tablehead">EVIDENCE</text>
  <line x1="110" y1="736" x2="1330" y2="736" stroke="#edf1f6"/>
  <text x="132" y="766" class="body">safe</text><text x="292" y="766" class="body">110</text><text x="420" y="766" class="body">90.8%</text><text x="640" y="766" class="body">88.3%</text><text x="858" y="766" class="body" fill="#235c9f">−2.5 points</text><rect x="1045" y="748" width="72" height="26" rx="13" fill="#e8f2ff"/><text x="1081" y="766" text-anchor="middle" class="small" fill="#1c579e">Model A</text><text x="1192" y="766" class="small" fill="#286bc1">Show 16</text>
  <line x1="110" y1="786" x2="1330" y2="786" stroke="#edf1f6"/>
  <text x="132" y="816" class="body">phishing</text><text x="292" y="816" class="body">25</text><text x="420" y="816" class="body">55.6%</text><text x="640" y="816" class="body">71.4%</text><text x="858" y="816" class="body" fill="#a35b1f">+15.9 points</text><rect x="1045" y="798" width="72" height="26" rx="13" fill="#fff0e2"/><text x="1081" y="816" text-anchor="middle" class="small" fill="#9b5319">Model B</text><text x="1192" y="816" class="small" fill="#286bc1">Show 19</text>
  <line x1="110" y1="836" x2="1330" y2="836" stroke="#edf1f6"/>
  <text x="132" y="866" class="body">malware</text><text x="292" y="866" class="body">10</text><text x="420" y="866" class="body">33.3%</text><text x="640" y="866" class="body">80.0%</text><text x="858" y="866" class="body" fill="#a35b1f">+46.7 points</text><rect x="1045" y="848" width="72" height="26" rx="13" fill="#fff0e2"/><text x="1081" y="866" text-anchor="middle" class="small" fill="#9b5319">Model B</text><text x="1192" y="866" class="small" fill="#286bc1">Show 7</text>
</svg>
